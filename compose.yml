name: 'bm_enterprises'

services:
  db:
    image: postgres:15
    container_name: bm_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '${POSTGRES_EXTERNAL_PORT}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build:
      context: ./src/backend
    container_name: bm_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '${BACKEND_EXTERNAL_PORT}:8000'
    environment:
      DATABASE_URL: 'postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}'
    command: sh -c "alembic -c backend/alembic.ini upgrade head && uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload --no-proxy-headers"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'python',
          '-c',
          'import urllib.request; urllib.request.urlopen("http://127.0.0.1:8000/api/v1/health", timeout=3).close()',
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    develop:
      watch:
        - action: sync
          path: ./src/backend
          target: /app/backend
          initial_sync: true
          ignore:
            - requirements.txt
            - Dockerfile
            - .dockerignore
        - action: rebuild
          path: ./src/backend/requirements.txt
        - action: rebuild
          path: ./src/backend/Dockerfile
        - action: rebuild
          path: ./src/backend/.dockerignore

  frontend:
    build:
      context: ./src/frontend
    container_name: bm_frontend
    restart: unless-stopped
    environment:
      VITE_CLERK_PUBLISHABLE_KEY: '${VITE_CLERK_PUBLISHABLE_KEY}'
      VITE_PUBLIC_FRONTEND_URL: '${VITE_PUBLIC_FRONTEND_URL:-}'
      VITE_API_BASE_URL: ''
      DEV_API_PROXY_TARGET: 'http://backend:8000'
    ports:
      - '${FRONTEND_EXTERNAL_PORT}:5173'
    depends_on:
      backend:
        condition: service_healthy
    develop:
      watch:
        - action: sync
          path: ./src/frontend
          target: /app
          initial_sync: true
          ignore:
            - package.json
            - package-lock.json
            - Dockerfile
            - .dockerignore
        - action: rebuild
          path: ./src/frontend/package.json
        - action: rebuild
          path: ./src/frontend/package-lock.json
        - action: rebuild
          path: ./src/frontend/Dockerfile
        - action: rebuild
          path: ./src/frontend/.dockerignore

  pgadmin:
    image: dpage/pgadmin4
    container_name: bm_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - '${PGADMIN_EXTERNAL_PORT:-5050}:80'
    depends_on:
      - db

volumes:
  pgdata:
