[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "N"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106"]
"migrations/versions/*" = ["S608"]
"src/Entity/access.py" = ["N802"]

[tool.black]
line-length = 110
target-version = ["py312"]
extend-exclude = ".venv"

[tool.pytest.ini_options]
pythonpath = [".."]
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning:backend.*"]
